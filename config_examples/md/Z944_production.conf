#############################################################
## JOB DESCRIPTION                                         ##
#############################################################
#
# First equilibration .conf file 
#
#############################################################
## ADJUSTABLE PARAMETERS                                   ##
#############################################################
set inputname   md-05
set outputname  md-06
set restart 1

set pvmode "p"
set temode "t"

proc get_first_ts { xscfile } {
  set fd [open $xscfile r]
  gets $fd
  gets $fd
  gets $fd line
  set ts [lindex $line 0]
  close $fd
  return $ts
}

set temperature    300
#cosAngles          on

structure 	 ../ionized.psf
coordinates	 ../ionized.pdb

if {$restart == 1} {
  bincoordinates  $inputname.restart.coor
  binvelocities   $inputname.restart.vel
  extendedSystem  $inputname.restart.xsc
  set currenttimestep [get_first_ts $inputname.restart.xsc]
#  COMMotion yes
} else {
  temperature $temperature
  set currenttimestep 0
}

firsttimestep   $currenttimestep

#############################################################
## SIMULATION PARAMETERS                                   ## 
#############################################################

# Input

paraTypeCharmm      on

parameters ../../charmm-gui-dzr/toppar/par_all36m_prot.prm
parameters ../../charmm-gui-dzr/toppar/par_all36_lipid.prm
parameters ../../charmm-gui-dzr/toppar/par_all36_carb.prm
parameters ../../charmm-gui-dzr/toppar/par_all36_cgenff.prm
parameters ../../charmm-gui-dzr/toppar/par_all36_na.prm
parameters /home/ubuntu/forcefield/toppar_water_ions_cufix.str
#parameters ../../charmm-gui-dzr/toppar/
parameters ../../charmm-gui-dzr/dzr/dzr.prm

# Force-Field Parameters
exclude             scaled1-4
1-4scaling          1.0
cutoff              12.0
switching           on
switchdist          10.
pairlistdist        13.5

# Periodic Boundary Conditions
wrapAll on ; # Wrap coordinates
PME yes ; # PME long-range electrostatics
PMEGridSpacing 1.0 ; # Grid spacing for PME
margin 2 ; # For box equilibration

#PME  (for full-system periodic electrostatics)
#if {1} {
#PME                 yes
#PMEGridSizeX       100
#PMEGridSizeY       100
#PMEGridSizeZ       100
#}
#

# Integrator Parameters
timestep            1.0   ;# 2fs/step
rigidBonds          all  ;# needed for 2fs steps
nonbondedFreq       1
fullElectFrequency  2
stepspercycle       20

# Constant Temperature Control
if {$temode == "t"} {
langevin            yes  ;# do langevin dynamics
langevinDamping     1     ;# damping coefficient(gamma)5/ps
langevinTemp        $temperature
langevinHydrogen    off    ;# don't couple langevin bath to hydrogens
}

# Periodic Boundary Conditions
if {1} {
cellBasisVector1    154.0     0.0     0.0
cellBasisVector2     0.0     154.0    0.0
cellBasisVector3     0.0      0.0    126.0 
cellOrigin           0.000      0.000    12.000 
}
#wrapAll             on
wrapWater           on

#margin 5.0


# Constant Pressure Control (variable volume)
useGroupPressure      no 
useFlexibleCell       yes     ;# no for water box, yes for membrane
useConstantArea       yes     ;# no for water box, yes for membrane
#useConstantRatio      no 

if {$pvmode == "p"} {
langevinPiston        on 
langevinPistonTarget  1.01325 ;#  in bar -> 1 atm
langevinPistonPeriod  200.  #usually 2000 for RBCG
langevinPistonDecay   50.  #usually 1000 for RBCG
langevinPistonTemp    $temperature
}

# Output
outputName          $outputname
restartfreq          1000   
dcdfreq              1000
xstFreq              1000
outputEnergies       1000
outputPressure       1000

if {0} {
fixedAtoms          on
fixedAtomsFile      ../ion-fixed.cnst
fixedAtomsCol       B
fixedAtomsForces    on
}


if {1} {
constraints         on
consexp             2
consref             ../ionized.pdb
conskfile           ../protein-termini-ion.cnst
conskcol            B
constraintScaling   2.0
}

#extraBonds       yes
#extraBondsFile   extrabonds.txt   
#############################################################
## EXTRA PARAMETERS                                        ##
#############################################################

# Heating

#reassignFreq    2000
#reassignTemp    100
#reassignIncr    1
#reassignHold    $temperature


#############################################################
## EXECUTION SCRIPT                                        ##
#############################################################

# Minimization
if {0} {
minimize             500 
reinitvels          $temperature
}

run 500000



